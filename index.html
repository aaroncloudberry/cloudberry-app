<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloudberry Ventures</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloudberry Ventures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECE7D4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
html,body{margin:0;height:100%;background:#ECE7D4}
#cb-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#6A645B;text-align:center;padding:24px}
#cb-boot img{width:96px;height:96px;animation:cbb 1.6s ease-in-out infinite}
#cb-boot button{border:0;border-radius:999px;background:#313830;color:#fff;font:inherit;padding:11px 20px;cursor:pointer}
@keyframes cbb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div id="cb-boot"><img src="icon-512.png" alt=""><div id="cb-boot-msg">Loading the app…</div></div>
<script>
(function(){
  var API_URL = "https://script.google.com/macros/s/AKfycbzNQ-kulj4nXsBuSvafB5uxh5q1urejqQ4PqIeA4KF2yfUA-_TGCoE0x0tiRP75Ba0wOw/exec", INJECT = "<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Cloudberry Ventures\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"theme-color\" content=\"#ECE7D4\">\n<link rel=\"apple-touch-icon\" href=\"icon-180.png\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"icon-192.png\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<style>\n#cb-auth{position:fixed;inset:0;z-index:200;background:var(--bg,#ECE7D4);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}\n#cb-auth.hidden{display:none}\n#cb-auth .box{max-width:340px;display:grid;gap:16px;justify-items:center;color:var(--ink,#313830)}\n#cb-auth img{width:84px;height:84px;border-radius:20px}\n#cb-auth h1{border:0;padding:0;margin:0;font-size:26px;font-weight:500;letter-spacing:-.01em}\n#cb-auth p{margin:0;font-size:14.5px;line-height:1.5;color:var(--soft,#6A645B)}\n#cb-auth button{border:0;border-radius:999px;background:#313830;color:#fff;font:inherit;font-size:16px;font-weight:500;padding:13px 22px;cursor:pointer;display:inline-flex;gap:10px;align-items:center}\n#cb-auth .err{color:#c0392b;font-size:13.5px}\nbody{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}\n.cb-who{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}\n.cb-who button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}\n<\/style>\n<script>\n// ---------- Full-screen app: Google sign-in + server calls (replaces google.script.run) ----------\n(function(){\n  var API_URL = \"https://script.google.com/macros/s/AKfycbzNQ-kulj4nXsBuSvafB5uxh5q1urejqQ4PqIeA4KF2yfUA-_TGCoE0x0tiRP75Ba0wOw/exec\", CLIENT_ID = \"46282923393-cf2ncl7foeh79dhpc9qkeplfms1nb9lk.apps.googleusercontent.com\", KEY = \"cb-session\";\n  function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }\n  function read(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }\n  function session(){ try { var x = JSON.parse(read(KEY) || \"null\"); return x && x.exp > Date.now() ? x : null; } catch (e) { return null; } }\n  var waiters = [];\n  function ready(){ return session() ? Promise.resolve(session()) : new Promise(function(res){ waiters.push(res); }); }\n  function post(body){\n    return fetch(API_URL, { method: \"POST\", body: JSON.stringify(body), redirect: \"follow\" })\n      .then(function(r){ if (!r.ok) throw new Error(\"The server didn\u2019t answer (\" + r.status + \").\"); return r.json(); });\n  }\n  function rand(){ var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return (\"0\" + b.toString(16)).slice(-2); }).join(\"\"); }\n  function signIn(){\n    var nonce = rand(), state = rand();\n    try { sessionStorage.setItem(\"cb-oauth\", JSON.stringify({ nonce: nonce, state: state, hash: location.hash })); } catch (e) {}\n    var redirect = location.origin + location.pathname;\n    location.href = \"https://accounts.google.com/o/oauth2/v2/auth?client_id=\" + encodeURIComponent(CLIENT_ID) + \"&redirect_uri=\" + encodeURIComponent(redirect) +\n      \"&response_type=id_token&scope=\" + encodeURIComponent(\"openid email profile\") + \"&nonce=\" + nonce + \"&state=\" + state + \"&prompt=select_account\";\n  }\n  function showAuth(msg){\n    var el = document.getElementById(\"cb-auth\");\n    if (!el) { el = document.createElement(\"div\"); el.id = \"cb-auth\"; document.body.appendChild(el); }\n    el.innerHTML = '<div class=\"box\"><img src=\"icon-180.png\" alt=\"\"><h1>Cloudberry Ventures<\/h1><p>Sign in with your Cloudberry Google account. You\u2019ll stay signed in on this device for 30 days.<\/p>' +\n      '<button type=\"button\" id=\"cb-signin\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path fill=\"#FFC107\" d=\"M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z\"/><path fill=\"#FF3D00\" d=\"m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z\"/><path fill=\"#4CAF50\" d=\"M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z\"/><path fill=\"#1976D2\" d=\"M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z\"/><\/svg>Sign in with Google<\/button>' +\n      (msg ? '<p class=\"err\">' + msg.replace(/[<>&]/g, \"\") + \"<\/p>\" : \"\") + \"<\/div>\";\n    el.classList.remove(\"hidden\");\n    document.getElementById(\"cb-signin\").onclick = signIn;\n  }\n  function signedIn(x){\n    store(KEY, JSON.stringify(x));\n    var el = document.getElementById(\"cb-auth\"); if (el) el.classList.add(\"hidden\");\n    var w = waiters; waiters = []; w.forEach(function(f){ f(x); });\n  }\n  window.cbSignOut = function(){\n    var x = session(); store(KEY, null);\n    if (x) post({ fn: \"logout\", session: x.session }).catch(function(){});\n    showAuth(\"\");\n  };\n  // Back from Google with an ID token in the address: take it out of the address straight away (before the app reads\n  // the address to pick a page), then finish signing in once the page has loaded.\n  var back = new URLSearchParams(location.hash.slice(1)), saved = {};\n  if (back.get(\"id_token\") || back.get(\"error\")) {\n    try { saved = JSON.parse(sessionStorage.getItem(\"cb-oauth\") || \"{}\"); sessionStorage.removeItem(\"cb-oauth\"); } catch (e) {}\n    history.replaceState(null, \"\", location.pathname + (saved.hash || \"\"));\n  } else back = null;\n  function finishSignIn(){\n    if (!back) return false;\n    var h = back;\n    if (h.get(\"error\")) { showAuth(\"Sign-in was cancelled.\"); return true; }\n    var tok = h.get(\"id_token\");\n    try { var p = JSON.parse(atob(tok.split(\".\")[1].replace(/-/g, \"+\").replace(/_/g, \"/\"))); if (!saved.nonce || p.nonce !== saved.nonce || h.get(\"state\") !== saved.state) { showAuth(\"Sign-in didn\u2019t match this page. Please try again.\"); return true; } } catch (e) { showAuth(\"Sign-in failed. Please try again.\"); return true; }\n    showAuth(\"Signing you in\u2026\"); document.getElementById(\"cb-signin\").disabled = true;\n    post({ fn: \"login\", arg: { idToken: tok } }).then(function(r){\n      if (!r.ok) throw new Error(r.error === \"SIGNIN\" ? \"Google didn\u2019t confirm the sign-in. Please try again.\" : r.error);\n      signedIn(r.result);\n    }).catch(function(err){ showAuth(String(err && err.message || err)); });\n    return true;\n  }\n  document.addEventListener(\"DOMContentLoaded\", function(){\n    if (!finishSignIn() && !session()) showAuth(\"\");\n    // \"Signed in as \u2026 \u00b7 Sign out\" at the bottom of the settings panel\n    var panel = document.getElementById(\"set-panel\"), x = session();\n    if (panel) { var d = document.createElement(\"div\"); d.className = \"cb-who\"; d.innerHTML = '<span id=\"cb-who-email\"><\/span><button type=\"button\" onclick=\"cbSignOut()\">Sign out<\/button>'; panel.appendChild(d);\n      setInterval(function(){ var s = session(); var e = document.getElementById(\"cb-who-email\"); if (e) e.textContent = s ? \"Signed in as \" + s.email : \"\"; }, 1000); }\n  });\n  // google.script.run look-alike: google.script.run.withSuccessHandler(f).withFailureHandler(g).someServerFunction(arg)\n  function runner(){\n    var ok = function(){}, ko = function(){};\n    var target = { withSuccessHandler: function(f){ ok = f; return proxy; }, withFailureHandler: function(f){ ko = f; return proxy; } };\n    var proxy = new Proxy(target, { get: function(t, name){\n      if (name in t) return t[name];\n      return function(arg){\n        ready().then(function(x){ return post({ fn: name, arg: arg, session: x.session }); }).then(function(r){\n          if (r.ok) return ok(r.result);\n          if (r.error === \"SIGNIN\") { store(KEY, null); showAuth(\"Your sign-in has expired. Please sign in again.\"); return ready().then(function(){ proxy[name](arg); }); }\n          ko(new Error(r.error));\n        }).catch(function(err){ ko(err); });\n      };\n    } });\n    return proxy;\n  }\n  window.google = window.google || {};\n  window.google.script = { get run(){ return runner(); } };\n})();\n<\/script>\n", NAME = "Cloudberry Ventures", KEY = "cb-page";
  function readCache(){ try { var x = JSON.parse(localStorage.getItem(KEY) || "null"); return x && x.stamp && x.html ? x : null; } catch (e) { return null; } }
  function saveCache(x){ try { localStorage.setItem(KEY, JSON.stringify(x)); } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} } }
  function check(have){
    return fetch(API_URL, { method: "POST", body: JSON.stringify({ fn: "page", arg: { have: have || "" } }), redirect: "follow" })
      .then(function(r){ if (!r.ok) throw new Error("The server didn’t answer (" + r.status + ")."); return r.json(); })
      .then(function(r){ if (!r.ok) throw new Error(r.error || "The server didn’t send the app."); return r.result; });
  }
  // The same changes build_app.py made: home-screen tags + sign-in/server shim, notch-safe viewport, wording, name.
  function prepare(html){
    var i = html.indexOf("</head>");
    html = html.slice(0, i) + INJECT + html.slice(i);
    if (html.indexOf("viewport-fit") < 0) html = html.replace('name="viewport" content="width=device-width, initial-scale=1"', 'name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"');
    html = html.replace("Check you’re signed in with your cloudberry.ventures Google account, then try again.", "Check your connection, then try again. If it keeps failing, sign out (settings, top right) and sign in again.");
    return html.replace(/<title>[^<]*<\/title>/, "<title>" + NAME + "</title>");
  }
  function show(html){ document.open(); document.write(prepare(html)); document.close(); var b = document.getElementById("cb-boot"); if (b) b.remove(); }
  function offerReload(){
    var b = document.createElement("div");
    b.setAttribute("style", "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:300;background:#313830;color:#fff;border-radius:999px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;font:14px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.18)");
    b.innerHTML = '<span>A new version of the app is ready.</span><button type="button" style="border:0;border-radius:999px;background:#ECE7D4;color:#313830;font:inherit;font-weight:600;padding:6px 14px;cursor:pointer">Update</button>';
    b.querySelector("button").onclick = function(){ location.reload(); };
    (document.body || document.documentElement).appendChild(b);
  }
  function fail(err){
    document.getElementById("cb-boot-msg").textContent = "Couldn’t load the app. " + (err && err.message || "Check your connection.");
    var btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Try again"; btn.onclick = function(){ location.reload(); };
    document.getElementById("cb-boot").appendChild(btn);
  }
  // Swap the page only once the launcher itself has finished loading: during loading the browser ignores
  // document.open() and would draw the app underneath the loading screen.
  function whenReady(f){ if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ setTimeout(f, 0); }); else setTimeout(f, 0); }
  var cached = readCache();
  if (cached) whenReady(function(){
    // Open the saved copy straight away; look for a newer one in the background.
    var shown = cached.stamp;
    show(cached.html);
    check(cached.stamp).then(function(r){
      if (r.html && r.stamp !== shown) { saveCache({ stamp: r.stamp, html: r.html }); offerReload(); }
    }).catch(function(){});
  }); else {
    check("").then(function(r){ saveCache({ stamp: r.stamp, html: r.html }); whenReady(function(){ show(r.html); }); }).catch(fail);
  }
})();
</script>
</body>
</html>
